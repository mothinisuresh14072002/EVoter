<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102E4A" flood-opacity=".12"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8396A8"/>
    </marker>
  </defs>
  <rect width="1400" height="570" rx="28" fill="#F8FAFC"/>
  <text x="70" y="76" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#0B2340">Voter Journey</text>
  <text x="70" y="110" font-family="Inter,Arial,sans-serif" font-size="18" fill="#60758A">A clear progression from identity proofing to a separated ballot and voter-visible receipt.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#sh)">
    <rect x="70" y="180" width="190" height="220" rx="24" fill="#FFFFFF"/>
    <circle cx="115" cy="225" r="24" fill="#FFF0DF"/>
    <text x="106" y="233" font-size="22" font-weight="800" fill="#B35A00">1</text>
    <text x="96" y="282" font-size="19" font-weight="800" fill="#0B2340">Authenticate</text>
    <text x="96" y="316" font-size="14" fill="#60758A">Start voter</text>
    <text x="96" y="340" font-size="14" fill="#60758A">identity flow</text>

    <rect x="284" y="180" width="190" height="220" rx="24" fill="#FFFFFF"/>
    <circle cx="329" cy="225" r="24" fill="#E8F3FF"/>
    <text x="320" y="233" font-size="22" font-weight="800" fill="#0B6E99">2</text>
    <text x="310" y="282" font-size="19" font-weight="800" fill="#0B2340">Capture</text>
    <text x="310" y="316" font-size="14" fill="#60758A">Reference + live</text>
    <text x="310" y="340" font-size="14" fill="#60758A">camera images</text>

    <rect x="498" y="180" width="190" height="220" rx="24" fill="#FFFFFF"/>
    <circle cx="543" cy="225" r="24" fill="#E8F3FF"/>
    <text x="534" y="233" font-size="22" font-weight="800" fill="#0B6E99">3</text>
    <text x="524" y="282" font-size="19" font-weight="800" fill="#0B2340">Verify</text>
    <text x="524" y="316" font-size="14" fill="#60758A">Quality • liveness</text>
    <text x="524" y="340" font-size="14" fill="#60758A">face similarity</text>

    <rect x="712" y="180" width="190" height="220" rx="24" fill="#FFFFFF"/>
    <circle cx="757" cy="225" r="24" fill="#F3EDF9"/>
    <text x="748" y="233" font-size="22" font-weight="800" fill="#6F3AA8">4</text>
    <text x="738" y="282" font-size="19" font-weight="800" fill="#0B2340">Authorize</text>
    <text x="738" y="316" font-size="14" fill="#60758A">verified • review</text>
    <text x="738" y="340" font-size="14" fill="#60758A">or failed</text>

    <rect x="926" y="180" width="190" height="220" rx="24" fill="#FFFFFF"/>
    <circle cx="971" cy="225" r="24" fill="#E8F7EC"/>
    <text x="962" y="233" font-size="22" font-weight="800" fill="#0C6B2E">5</text>
    <text x="952" y="282" font-size="19" font-weight="800" fill="#0B2340">Vote</text>
    <text x="952" y="316" font-size="14" fill="#60758A">Separate ballot</text>
    <text x="952" y="340" font-size="14" fill="#60758A">selection domain</text>

    <rect x="1140" y="180" width="190" height="220" rx="24" fill="#FFFFFF"/>
    <circle cx="1185" cy="225" r="24" fill="#E8F7EC"/>
    <text x="1176" y="233" font-size="22" font-weight="800" fill="#0C6B2E">6</text>
    <text x="1166" y="282" font-size="19" font-weight="800" fill="#0B2340">Receipt</text>
    <text x="1166" y="316" font-size="14" fill="#60758A">Voter-visible</text>
    <text x="1166" y="340" font-size="14" fill="#60758A">verification UX</text>
  </g>

  <g stroke="#8396A8" stroke-width="4" marker-end="url(#ar)">
    <line x1="260" y1="290" x2="274" y2="290"/>
    <line x1="474" y1="290" x2="488" y2="290"/>
    <line x1="688" y1="290" x2="702" y2="290"/>
    <line x1="902" y1="290" x2="916" y2="290"/>
    <line x1="1116" y1="290" x2="1130" y2="290"/>
  </g>

  <rect x="180" y="455" width="1040" height="58" rx="18" fill="#0B2340"/>
  <text x="220" y="491" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Biometric data is temporary; only the authorization outcome should cross into the voting application.</text>
</svg>