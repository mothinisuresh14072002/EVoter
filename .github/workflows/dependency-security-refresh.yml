name: One-time dependency security refresh

on:
  push:
    branches:
      - production/redis-liveness-hardening
    paths:
      - .github/workflows/dependency-security-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/redis-liveness-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js security release
        run: |
          npm install --save-exact next@16.3.8 eslint-config-next@16.3.8
          npm audit fix --package-lock-only

      - name: Validate root application
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh Vite-compatible dependency lock
        working-directory: frontend
        run: |
          npm audit fix --package-lock-only
          npm ci
          npm run build

      - name: Report audits
        run: |
          echo "ROOT AUDIT"
          npm audit --audit-level=high || true
          echo "VITE HARNESS AUDIT"
          (cd frontend && npm audit --audit-level=high) || true

      - name: Commit refreshed dependency locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "security: refresh patched frontend dependencies"
            git push origin HEAD:production/redis-liveness-hardening
          fi
