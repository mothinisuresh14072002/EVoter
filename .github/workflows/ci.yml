name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Next.js frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  biometric_frontend:
    name: Biometric Vite frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest backend/tests -q

  containers:
    name: Production deployment validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        env:
          SESSION_SIGNING_SECRET: ci-session-signing-secret-at-least-32-characters
          ADMIN_UI_PASSWORD: ci-admin-password
          ADMIN_API_KEY: ci-admin-api-key-at-least-32-characters
        run: |
          cp backend/.env.example backend/.env
          docker compose config --quiet
      - name: Build frontend image
        run: docker build -t evoter-frontend:test .
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t evoter-backend:test .
      - name: Verify containers run as non-root
        run: |
          test "$(docker image inspect evoter-frontend:test --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect evoter-backend:test --format '{{.Config.User}}')" = "evoter"
      - name: Smoke-test frontend runtime health
        run: |
          docker run -d --name evoter-frontend-smoke             -p 127.0.0.1:3000:3000             -e NODE_ENV=production             -e EVOTER_DEMO_MODE=true             -e SESSION_SIGNING_SECRET=ci-session-signing-secret-at-least-32-characters             -e ADMIN_UI_PASSWORD=ci-admin-password             -e ADMIN_API_KEY=ci-admin-api-key-at-least-32-characters             -e BACKEND_INTERNAL_URL=http://127.0.0.1:8000             evoter-frontend:test
          trap 'docker rm -f evoter-frontend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs evoter-frontend-smoke
          exit 1
